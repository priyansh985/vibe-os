name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check bundled CLI
        run: |
          python -m vibeos --version
          python -m vibeos assess --risk low --scope small --uncertainty low --reversibility easy

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tool
        run: python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Validate wheel in clean environment
        run: |
          python -m venv /tmp/vibeos-package-check
          /tmp/vibeos-package-check/bin/python -m pip install dist/*.whl
          /tmp/vibeos-package-check/bin/python -m vibeos --version
          /tmp/vibeos-package-check/bin/python -c "from pathlib import Path; import vibeos; p = Path(vibeos.__file__).parent / 'bundle' / 'vibe-os' / 'SKILL.md'; assert p.is_file(), p"
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibe-os-distributions
          path: dist/
          if-no-files-found: error
